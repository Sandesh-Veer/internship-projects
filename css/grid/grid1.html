<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .container{
          width: 300px;
          height: 300px;
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          grid-template-rows: 1fr 1fr 1fr;
          gap: 4px 4px;
        }
        .div1{
          background-color: blueviolet;
        }
        .div2{
        background-color: greenyellow;
        grid-row-start: 2;
        grid-row-end: 3;
        grid-column-start: 2;
        grid-column-end: 3;
        }
        .div3{
        background-color:red;
        grid-row-start: 3;
        grid-row-end: 3;
        grid-column-start: 3;
        grid-column-end: 3;
        }
        .d{
          width: 100;
          height: 100;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d div1"></div>
        <div class="d div2"></div>
        <div class="d div3"></div>
    </div>
</body>
</html>
